name: Build KmPlayer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Scaffold & Build KmPlayer
        run: |
          rm -rf km_player
          flutter create --org com.km --project-name km_player km_player
          cd km_player

          # Lock dependencies to compatible versions
          flutter pub add video_player:^2.9.2 chewie:^1.8.5 file_picker:^8.1.4 shared_preferences:^2.3.3

          # Set Android 10+ (API 29 minimum)
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 29/g' android/app/build.gradle

