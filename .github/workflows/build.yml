name: Build Video Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Create Minimal App Resources
        run: |
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Km Player</string>
          </resources>
          EOF
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.KmPlayer" parent="Theme.Material3.DayNight.NoActionBar" />
          </resources>
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KmPlayer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
